services:
  duckdesk:
    build: .
    ports:
      - "4000:4000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      INCIDENT_RESPONSE_CODE: ${INCIDENT_RESPONSE_CODE}
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  data:
