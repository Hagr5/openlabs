services:
  duckrpc:
    build:
      context: .
      dockerfile: Dockerfile

    image: ctf/duckrpc-archive:1.0.0

    container_name: chal-duckrpc-archive

    restart: unless-stopped


    # -------------------------
    # SECURITY
    # -------------------------

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/ctf/tmp:size=32m,mode=1700


    user: 1000:1000


    # -------------------------
    # RESOURCES
    # -------------------------

    mem_limit: 256m
    memswap_limit: 256m
    mem_reservation: 128m

    cpus: 0.5

    pids_limit: 128


    # -------------------------
    # NETWORK
    # -------------------------

    networks:
      - ctf_internal

    ports:
      - "127.0.0.1:50051:50051"


    # -------------------------
    # ENVIRONMENT
    # -------------------------

    environment:

      FLAG: ${FLAG}

      PORT: 50051

      DB_PATH: /tmp/duckrpc.db


    # -------------------------
    # LOGGING
    # -------------------------

    logging:

      driver: "json-file"

      options:

        max-size: "10m"

        max-file: "3"


networks:

  ctf_internal:

    driver: bridge