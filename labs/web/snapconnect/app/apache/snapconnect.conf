<VirtualHost *:80>
    ServerName snapconnect.local
    DocumentRoot /var/www/public

    <Directory /var/www/public>
        Options -Indexes
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteRule ^graphql/?$ graphql.php [L]
        RewriteRule ^docs/?$ docs.php [L]
    </Directory>

    <Directory /var/www/public/uploads>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
</VirtualHost>
