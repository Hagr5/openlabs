<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar Document Hub</title><style>
body{margin:0;background:#f4f6f8;color:#1c2733;font:15px system-ui,sans-serif}.bar{background:#18324b;color:#fff;padding:18px 8%;font-weight:700;letter-spacing:.2px}main{max-width:920px;margin:36px auto;padding:0 18px}.card{background:#fff;border:1px solid #dce3e8;border-radius:8px;padding:22px;margin:16px 0;box-shadow:0 1px 2px #00000008}input,button{box-sizing:border-box;padding:10px;border-radius:5px;border:1px solid #bac6d0;font:inherit}input{width:100%;margin:7px 0}button{background:#256b9a;color:#fff;border:0;cursor:pointer;margin-top:8px}.muted{color:#60717f}.row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf0f2;padding:12px 0}.row:first-child{border-top:0}pre{background:#f7f9fa;padding:12px;overflow:auto;border-radius:5px}.error{color:#a52222}</style></head>
<body><div class="bar">Northstar Document Hub <span id="identity" style="float:right;font-weight:400"></span></div><main>
<section id="login" class="card"><h1>Sign in</h1><p class="muted">Use the training account supplied with this environment.</p><form id="loginForm"><input id="username" placeholder="Username" autocomplete="username" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button>Sign in</button></form><p id="error" class="error"></p></section>
<section id="workspace" hidden><div class="card"><h1>Your documents</h1><div id="documents"></div></div><div class="card"><h2>Company notices</h2><div id="announcements"></div></div><div class="card"><h2>API activity</h2><p class="muted">This application uses the REST API for its workspace data. Browser developer tools can be used to inspect requests.</p><pre id="api">Waiting for activity…</pre></div></section>
</main><script src="/app.js"></script></body></html>
