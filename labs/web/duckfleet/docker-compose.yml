name: duckfleet

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FLAG: ${FLAG:?Set FLAG in your .env file (see .env.example)}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DB_PATH: /data/duckfleet.db
    volumes:
      - backend-data:/data
    networks:
      - duckfleet
    healthcheck:
      test: ["CMD", "node", "src/healthprobe.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    environment:
      BACKEND_ADDR: backend:50051
      PORT: "4000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - duckfleet
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  backend-data:

networks:
  duckfleet:
    driver: bridge
