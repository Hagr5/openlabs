syntax = "proto3";

package auth;

import "google/protobuf/empty.proto";

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc WhoAmI(google.protobuf.Empty) returns (UserInfo);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string token_type = 2;
  int64 expires_in = 3;
}

message UserInfo {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  string role = 4;
}
