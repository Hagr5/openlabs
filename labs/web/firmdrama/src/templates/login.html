<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/static/css/app.css">
  <title>RoomReserve | Sign in</title>
</head>

<body class="auth-shell" data-page="login">
  <main class="auth-card">
    <div class="brand-mark">AV</div>
    <p class="eyebrow">Alder &amp; Vale · Internal systems</p>
    <h1>RoomReserve</h1>
    <p class="muted">Coordinate confidential meetings, rooms, and facilities requests.</p>
    <form id="login-form" class="stack"><label>Username<input name="username" autocomplete="username"
          required></label><label>Password<input name="password" type="password" autocomplete="current-password"
          required></label><button id="login-submit" type="submit">Sign in securely</button>
      <p id="error" class="form-error" role="alert"></p>
    </form>
    <p class="fine-print">Authorized firm personnel only</p>
  </main>
  <script src="/static/js/app.js" defer></script>
</body>

</html>
