<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/static/css/app.css">
  <title>RoomReserve | Calendar</title>
</head>

<body data-page="calendar">
  {% include 'partials/nav.html' %}
  <main class="page">
    <section class="hero compact">
      <div>
        <p class="eyebrow">Calendar</p>
        <h1>Room schedule</h1>
        <p class="muted">Review upcoming reservation details and room requirements.</p>
      </div><a class="button-link" href="/rooms">Book a room</a>
    </section>
    <section class="panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Upcoming</p>
          <h2>Confirmed bookings</h2>
        </div>
      </div>
      <div id="calendar-list" class="booking-list">
        <p class="muted">Loading calendar…</p>
      </div>
    </section>
    <section class="panel calendar-history">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Past</p>
          <h2>Booking history</h2>
        </div>
      </div>
      <div id="calendar-history" class="booking-list">
        <p class="muted">Loading booking history…</p>
      </div>
    </section>
  </main>
  <script src="/static/js/app.js" defer></script>
</body>

</html>
