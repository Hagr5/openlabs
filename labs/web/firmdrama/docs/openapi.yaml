# Maintainer/evaluator reference. Included in source; not served by the application.
openapi: 3.1.1
info:
  title: firmdrama API — Maintainer Reference
  version: 1.0.0
  contact:
    name: Ziad Osama El-Boshy
  summary: Complete JSON API contract for maintainers and evaluators.
  description: |-
    Maintainer/evaluator reference included in the complete public-source project. Keep it out of spoiler-free player handouts and the running challenge's HTTP surface. Source publication and player-handout distribution are separate concerns.

    Describes the implemented JSON API and readiness endpoint. Browser HTML pages, static assets and Flask-generated HEAD/OPTIONS methods are outside this specification. All 20 explicit JSON operations are included, including the retired v2 response. v1 and v3 are implemented namespaces; the document version identifies this reference, not an API namespace.

    Use application/json for JSON request bodies. Collections are unpaginated and have no documented query parameters. Response timestamps use UTC ISO 8601 with Z. Booking input follows the runtime parser described in BookingRequest. Schemas describe payload structure; database availability, authorization, timestamp ordering and Python conversion rules remain runtime checks.

    Application JSON errors contain error and message. A missing route returns 404/not_found; an unsupported method returns 405/method_not_allowed. Host rejection and errors generated by an external HTTP edge may use HTML or another format. Request-size enforcement applies when Flask reads the body; the default limit is 65,536 bytes. JSON responses have Cache-Control: no-store and the security headers listed on responses.

    Authentication accepts an opaque bearer token or a browser session cookie. A nonempty Authorization header takes precedence and prevents cookie fallback; the implementation recognizes the exact Bearer prefix followed by one space. Sessions expire after two hours and are invalidated by logout or reset. Cookie-authenticated writes also require X-firmdrama-Client: browser. This header is a browser request marker, not a credential.

    Examples are synthetic documentation values, not seeded records or executable walkthroughs. No credentials, session tokens, approval values or flags are embedded. This file is manually maintained against src/app.py, src/api/, src/auth.py, src/config.py and database/schema.sql; validate it with docs/tools/validate_openapi.py.
servers:
- url: http://127.0.0.1:8080
  description: Default local lab ingress; replace locally if deployment differs.
tags:
- name: Health
  description: Application readiness.
- name: Authentication
  description: Session creation and revocation.
- name: Profile
  description: Current account and profile changes.
- name: Rooms and bookings
  description: Room inventory and reservation lifecycle.
- name: Portal
  description: Current-user maintenance requests and notices.
- name: Dashboards
  description: Dashboard metadata and links.
- name: Conversations
  description: Nested conversation and message resources.
- name: Facilities
  description: Role-restricted Facilities interfaces and version status.
security:
- BearerAuth: []
- BrowserSession: []
x-audience: maintainers-and-evaluators
x-source-distribution: public
x-player-handout: false
paths:
  /health:
    get:
      tags:
      - Health
      summary: Read application readiness
      description: When database readiness is required and unavailable, returns 503. Readiness does not establish
        completion of release acceptance.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Successful response.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            X-Frame-Options:
              $ref: '#/components/headers/X-Frame-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Permissions-Policy:
              $ref: '#/components/headers/Permissions-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                service: firmdrama
        '400':
          $ref: '#/components/responses/InvalidHost'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Required database is unavailable.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            X-Frame-Options:
              $ref: '#/components/headers/X-Frame-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Permissions-Policy:
              $ref: '#/components/headers/Permissions-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: unavailable
                service: firmdrama
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Create a session
      description: Creates a two-hour session; at most 20 sessions per user are retained, evicting the oldest on login.
        Expired sessions are pruned at issuance. Usernames are trimmed and lowercased, then restricted to ASCII
        letters, digits, dots, underscores and hyphens. Five attempts in a rolling 60-second window per process,
        remote address and normalized username cause 429 on subsequent attempts; successful login clears that key.
        Concurrent attempts reserve their slot before credential verification. The limiter retains at most 1024
        active keys and rejects new keys with 429 when full. Extra JSON fields are ignored.
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful response.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            X-Frame-Options:
              $ref: '#/components/headers/X-Frame-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Permissions-Policy:
              $ref: '#/components/headers/Permissions-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Malformed JSON, a non-object body, missing fields or invalid field values. Trusted-host
            rejection can instead return HTML.
          headers:
            Cache-Control:
              description: no-store on JSON errors; not asserted for framework HTML errors.
              schema:
                type: string
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            X-Frame-Options:
              $ref: '#/components/headers/X-Frame-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Permissions-Policy:
              $ref: '#/components/headers/Permissions-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/html:
              schema:
                type: string
          x-error-codes:
          - invalid_request
        '401':
          description: Invalid username or password.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            X-Frame-Options:
              $ref: '#/components/headers/X-Frame-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Permissions-Policy:
              $ref: '#/components/headers/Permissions-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
          - invalid_credentials
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          description: Login failure limit reached; wait the Retry-After interval.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            X-Frame-Options:
              $ref: '#/components/headers/X-Frame-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Permissions-Policy:
              $ref: '#/components/headers/Permissions-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
          - rate_limited
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: X-firmdrama-Client
        in: header
        required: false
        description: Optional. The literal browser value requests the session cookie in addition to the token
          response.
        schema:
          type: string
          enum:
          - browser
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Revoke the current session
      description: Revokes the authenticated session and clears its browser cookie. No body is required.
      operationId: revokeSession
      security:
