            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            X-Frame-Options:
              $ref: '#/components/headers/X-Frame-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Permissions-Policy:
              $ref: '#/components/headers/Permissions-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                status: signed_out
        '400':
          $ref: '#/components/responses/InvalidHost'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: Required role or browser request header is missing, as applicable.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            X-Frame-Options:
              $ref: '#/components/headers/X-Frame-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Permissions-Policy:
              $ref: '#/components/headers/Permissions-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
          - csrf_protection_required
        '500':
          $ref: '#/components/responses/InternalError'
