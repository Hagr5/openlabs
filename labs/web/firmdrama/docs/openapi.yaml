            Permissions-Policy:
              $ref: '#/components/headers/Permissions-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreated'
        '400':
          description: Malformed JSON, a non-object body, missing fields or invalid field values. Trusted-host
            rejection can instead return HTML.
          headers:
