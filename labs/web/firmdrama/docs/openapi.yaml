  /api/v1/users/{user_id}/profile:
    patch:
      tags:
      - Profile
      summary: Update the current profile
      description: The path must identify the authenticated user. At least one editable field or role_id is
        required. Unknown properties are rejected; a delegation approval alone is not an update. A changed
        role must be 499 and requires a valid unused approval whose recorded target is 499. A successful role
        499 change consumes it. Returns the complete updated profile.
      operationId: updateProfile
      parameters:
      - name: user_id
        in: path
        required: true
        description: Resource identifier; constrained by the current application context.
        schema:
          type: integer
          minimum: 0
      security:
      - BearerAuth: []
      - BrowserSession: []
        BrowserRequestHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
            example:
              display_name: Alex Morgan
              department: Operations
              role_id: 1
              delegation_approval_id: 'NULL'
      responses:
        '200':
          description: Successful response.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            X-Frame-Options:
              $ref: '#/components/headers/X-Frame-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Permissions-Policy:
              $ref: '#/components/headers/Permissions-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid JSON, property type or length, ineligible role, empty update or unknown property.
            Trusted-host rejection can instead return HTML.
          headers:
            Cache-Control:
              description: no-store on JSON errors; not asserted for framework HTML errors.
              schema:
                type: string
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            X-Frame-Options:
              $ref: '#/components/headers/X-Frame-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Permissions-Policy:
              $ref: '#/components/headers/Permissions-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/html:
              schema:
                type: string
          x-error-codes:
          - invalid_request
          - immutable_property
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: Missing browser request header, or missing, invalid, expired or consumed delegation
            approval.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            X-Frame-Options:
              $ref: '#/components/headers/X-Frame-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Permissions-Policy:
              $ref: '#/components/headers/Permissions-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
          - csrf_protection_required
          - delegation_approval_required
        '404':
          description: Profile not found for this account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            X-Frame-Options:
              $ref: '#/components/headers/X-Frame-Options'
            Referrer-Policy:
