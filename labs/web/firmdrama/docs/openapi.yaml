  /api/v1/bookings:
    post:
      tags:
      - Rooms and bookings
      summary: Create a room booking
      description: Books an available room for the current user. End time must follow start time. Missing or
        unavailable rooms and overlapping confirmed bookings return 409. Extra JSON fields are ignored.
      operationId: createBooking
      security:
      - BearerAuth: []
      - BrowserSession: []
        BrowserRequestHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
            example:
              room_id: 42
              matter_code: DOCS-DEMO
              purpose: Planning meeting
              starts_at: '2030-01-15T09:00:00Z'
              ends_at: '2030-01-15T10:00:00Z'
      responses:
        '201':
          description: Successful response.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            X-Frame-Options:
