services:
  fieldops:
    build:
      context: .
      dockerfile: Dockerfile
    image: ducklabs/fieldops-360:1.0.0
    container_name: fieldops-360-lab

    restart: unless-stopped

    # One documented host port. The brief states the same port.
    ports:
      - "8080:8000"

    # Container hardening. The app writes nothing to disk.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/ctf/tmp:size=32m,mode=1700
    user: "1000:1000"

    mem_limit: 256m
    memswap_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    pids_limit: 128

    environment:
      RESET_TOKEN: ${RESET_TOKEN:-fieldops-reset-token}
      FLASK_ENV: production

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
